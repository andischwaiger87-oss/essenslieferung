<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Essen auf Rädern Fahrplan</title>
<meta name="robots" content="noindex">
<style>
@font-face{font-family:'Outfit';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/outfit-latin-ext-wght-normal.woff2) format('woff2');unicode-range:U+0100-02AF,U+0304,U+0308,U+0329,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:'Outfit';font-style:normal;font-weight:100 900;font-display:swap;src:url(fonts/outfit-latin-wght-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Layout: weicher heller Grund, Pastellflaechen je Route, runde Formen, keine Rahmen.
   Eine ruhige Illustration (Huegel, Sonne, Lieferwagen), die nur beim Oeffnen und nach einer Zusage faehrt. */
:root{
  color-scheme: light;
  --bg:#F3F5FA; --surface:#FFFFFF; --ink:#1B2333; --muted:#535E73; --line:#E8ECF3; --soft:#E9EDF5;
  --brand:#1A5376; --brand-deep:#123E59; --sky:#D9E9FA;
  --open-bg:#FFE9D6; --open-ink:#6E3410; --ok-bg:#D8F0E3; --ok-ink:#0C5A3F; --stop:#9E2A2B; --stop-bg:#FBE7E6; --sun:#FFD98A;
  --display:"Outfit","Segoe UI",system-ui,sans-serif; --body:"Outfit","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;font-weight:400;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p{margin:0}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
main:focus{outline:0}

.demo{padding:12px 16px 0}
.demo-in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.demo p{font-size:14px;color:var(--muted)}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;gap:2px}
.seg button{white-space:nowrap;border:0;background:transparent;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;min-height:36px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}

.app{max-width:540px;margin:0 auto}
main{padding:22px 18px 132px;display:flex;flex-direction:column;gap:18px;animation:in .3s ease}
.hello{font-weight:600;font-size:clamp(30px,8.8vw,38px);line-height:1.1;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);font-size:18px;margin-top:2px}
h2{font-size:18px;font-weight:500;color:var(--muted);margin:6px 4px -6px}
.stack{display:flex;flex-direction:column;gap:10px}
.top{display:grid;gap:16px;grid-template-areas:"g" "h" "a"}
.greet{grid-area:g;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 4px}
.top .alert{grid-area:a}

.card{background:var(--surface);border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.open{background:var(--open-bg)}
.card.line{flex-direction:row;justify-content:space-between;align-items:center;gap:12px;padding:10px 18px 10px 10px;border-radius:24px}
.route{display:flex;align-items:center;gap:10px;font-weight:600;font-size:24px}
.dot{width:14px;height:14px;border-radius:50%;flex:none}
.who{font-size:20px;font-weight:500;line-height:1.2}
.when{font-size:20px;font-weight:500}
.small{font-size:16px;color:var(--muted)}
.open .small{color:var(--open-ink)}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.person{display:flex;align-items:center;gap:12px;min-width:0}
.person .t{display:flex;flex-direction:column;min-width:0}
.av{flex:none;width:48px;height:48px;border-radius:17px;display:grid;place-items:center;font-weight:600;font-size:16px;color:var(--ink)}
.av.big{width:54px;height:54px;border-radius:50%;font-size:18px}
.av.q{background:#fff;color:var(--open-ink);font-size:22px}
.plate{display:inline-flex;background:var(--bg);border-radius:10px;font-size:15px;letter-spacing:.05em;color:var(--ink);padding:5px 11px;white-space:nowrap}
.plate b{font-weight:500}
.hero .plate,.open .plate{background:#fff}
.plate.new{letter-spacing:0;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 14px;font-size:15px;font-weight:500}
.pill.ok{background:var(--ok-bg);color:var(--ok-ink)}
.pill.wait{background:#fff;color:var(--open-ink)}
.pill.you{background:var(--brand);color:#fff}
.pill.now{background:#FFE9A8;color:#4F3A00}
.pill.tag{background:#fff;color:var(--brand);align-self:flex-start}

.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:58px;width:100%;border-radius:999px;border:0;background:var(--brand);color:#fff;font-weight:500;font-size:19px;padding:10px 20px;transition:transform .16s cubic-bezier(.2,.9,.3,1.4),background .15s ease}
.btn:hover{background:var(--brand-deep)}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--sky);color:var(--brand-deep)}
.btn.ghost:hover{background:#C8DEF5}
.btn.white{background:#fff;color:var(--brand-deep)}
.btn.white:hover{background:#F3F7FB}
.btn.quiet{background:var(--soft);color:var(--ink);min-height:54px;font-size:17px}
.btn.quiet:hover{background:#DDE3EE}
.btn.stop{background:var(--stop-bg);color:var(--stop)}
.btn.stop:hover{background:#F6D6D4}
.btn.go{background:var(--ok-ink)}
.btn.go:hover{background:#08452F}

.alert{display:flex;align-items:center;gap:12px;text-align:left;background:var(--open-bg);border:0;color:var(--open-ink);border-radius:26px;padding:10px 12px;min-height:62px;width:100%;font-weight:500;font-size:18px;transition:transform .16s ease}
.alert:active{transform:scale(.98)}
.alert .mid{flex:1}
.bang,.chev{flex:none;width:40px;height:40px;border-radius:50%;background:#fff;display:grid;place-items:center;font-weight:600}

/* Buehne */
.hero{grid-area:h;position:relative;overflow:hidden;border-radius:34px;background:var(--cs);padding:22px 22px 20px;display:flex;flex-direction:column;gap:4px}
.hero .big{font-weight:600;font-size:clamp(28px,8vw,34px);line-height:1.1;margin-top:8px}
.hero .when{color:#24405A}
.hero .btn{margin-top:12px}
.scene{position:relative;height:96px;margin:6px -22px 0}
.scene .hills{position:absolute;inset:0;width:100%;height:100%}
.scene .van{position:absolute;left:26px;bottom:5px;width:150px;height:75px;animation:drivein 1.3s cubic-bezier(.16,.84,.3,1) both}
.scene .van .spin{animation:spin .43s linear 3}
.scene .plate{position:absolute;right:22px;bottom:12px}
.van-s{width:56px;height:28px;flex:none}
.pass{position:fixed;left:0;bottom:calc(98px + env(safe-area-inset-bottom,0px));z-index:25;pointer-events:none;animation:pass 1.7s cubic-bezier(.5,0,.7,.4) forwards}
.pass svg{width:120px;height:60px;display:block}
.pass .spin{animation:spin .35s linear infinite}
@keyframes drivein{from{transform:translateX(-220px)}}
@keyframes pass{from{transform:translateX(-140px)}to{transform:translateX(100vw)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes in{from{opacity:0;transform:translateY(8px)}}

/* Plan */
.weeknav{display:grid;grid-template-columns:56px 1fr 56px;gap:10px;align-items:center;background:var(--surface);border-radius:999px;padding:8px}
.weeknav button{height:56px;border-radius:50%;border:0;background:var(--sky);color:var(--brand-deep);font-size:26px;font-weight:500;transition:transform .16s ease,background .15s}
.weeknav button:hover:not(:disabled){background:#C8DEF5}
.weeknav button:active:not(:disabled){transform:scale(.92)}
.weeknav button:disabled{opacity:.35;cursor:default}
.weeknav div{text-align:center}
.weeknav strong{display:block;font-weight:600;font-size:22px;line-height:1.15}
.weeknav .sub{margin:0;font-size:16px;display:block}
.note{background:#FFF3C9;color:#4F3A00;border-radius:20px;padding:12px 18px;font-size:17px}
.cover{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 4px;font-size:14px;color:var(--muted);text-align:center}
.cover .bar{height:10px;border-radius:5px;background:var(--cs)}
.cover .bar.me{background:var(--c)}
.cover .bar.gap{background:#FFC9A0}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 12px 8px 8px;border-radius:22px}
.row .t{display:flex;flex-direction:column;min-width:0;flex:1}
.row .days{font-size:15px;color:var(--muted)}
.row .n{font-size:19px;font-weight:500;line-height:1.2}
.row.me{background:var(--sky)}
.row.me .days{color:#24405A}
.row.gap{background:var(--open-bg);color:var(--open-ink)}
.row.gap .days{color:var(--open-ink)}
.row .btn{flex-basis:100%;min-height:52px;font-size:17px;background:#fff;color:var(--open-ink)}
.cands{display:flex;flex-direction:column;gap:8px}
.cand{display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--surface);border-radius:22px;padding:8px 8px 8px 10px;font-weight:500;font-size:19px;color:var(--ink)}
.cand .btn{width:auto;min-height:50px;font-size:17px;padding:8px 20px}

/* Leiste unten */
nav{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(512px,calc(100% - 28px));z-index:10;background:var(--surface);border-radius:32px;box-shadow:0 14px 30px -14px rgba(27,35,51,.35);display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px}
nav:empty{display:none}
nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:60px;justify-content:center;border:0;background:transparent;border-radius:26px;font-size:15px;color:var(--muted);transition:background .2s ease,color .2s ease,transform .16s ease}
nav button:active{transform:scale(.94)}
nav button svg{width:26px;height:26px}
nav button[aria-current="page"]{background:var(--sky);color:var(--brand-deep);font-weight:600}
nav .badge{position:absolute;top:5px;left:56%;min-width:24px;height:24px;border-radius:12px;background:#E0762F;color:#fff;font-size:14px;font-weight:600;display:grid;place-items:center;padding:0 6px;box-shadow:0 0 0 2px #fff}
nav .badge{background:#B4530F}

/* Dialog und Rueckmeldung */
.veil{position:fixed;inset:0;background:rgba(27,35,51,.42);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .18s ease}
.sheet{background:var(--surface);width:100%;max-width:540px;border-radius:34px 34px 0 0;padding:14px 20px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto;animation:up .28s cubic-bezier(.2,.9,.3,1.1)}
.sheet::before{content:"";align-self:center;width:44px;height:5px;border-radius:3px;background:#D5DBE6;flex:none}
.sheet h3{font-weight:600;font-size:28px;line-height:1.15;text-wrap:balance}
.sheet p{font-size:19px}
.toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(500px,calc(100% - 28px));background:var(--ink);color:#fff;border-radius:26px;padding:12px 18px 12px 12px;display:flex;gap:12px;align-items:center;font-weight:500;font-size:18px;z-index:30;box-shadow:0 16px 32px -14px rgba(27,35,51,.5);animation:pop .34s cubic-bezier(.2,1.4,.4,1)}
.toast svg{flex:none;width:38px;height:38px}
.toast path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .4s .15s ease forwards}
#live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.names{display:flex;flex-direction:column;gap:8px}
.names .btn{justify-content:flex-start;font-size:19px;background:var(--surface);color:var(--ink);border-radius:24px;padding:8px 18px 8px 8px;min-height:64px}
.names .btn:hover{background:var(--sky)}
.sheet .names .btn{background:var(--bg)}
.field{display:flex;flex-direction:column;gap:8px;font-weight:500}
.field input{font:inherit;font-weight:400;min-height:58px;border-radius:20px;border:1.5px solid #8490A6;padding:8px 18px;background:#fff;color:var(--ink)}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(48px);opacity:0}}
@keyframes pop{from{transform:translateX(-50%) translateY(12px) scale(.94);opacity:0}}
@keyframes draw{to{stroke-dashoffset:0}}
.flash{animation:flash 1.4s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(12,90,63,.5)}100%{box-shadow:0 0 0 22px rgba(12,90,63,0)}}

@media (min-width:860px){
  .app{max-width:1100px}
  main{padding:28px 24px 140px;gap:24px}
  .stack{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));align-items:start;gap:14px}
  .names{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
  .sheet .names{display:flex}
  .top{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr;grid-template-areas:"g h" "a h";gap:20px 24px;align-items:start}
  .weeknav,.narrow{max-width:540px}
  .veil{align-items:center}
  .sheet{border-radius:34px}
  .sheet::before{display:none}
}
@media (max-width:350px){main{padding-left:12px;padding-right:12px}.card{padding:14px}.hero{padding:18px 18px 16px}.scene{margin:6px -18px 0}.scene .van{width:124px;height:62px;left:16px}.scene .plate{right:14px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.toast path{stroke-dashoffset:0}}
</style>
</head>
<body>
<div class="demo"><div class="demo-in">
  <p><strong>Prototyp.</strong> Beispieltag: Do, 28. Jänner 2027. Nichts wird gespeichert.</p>
  <div class="seg" id="demoRow"></div>
</div></div>
<div class="app">
  <main id="main" tabindex="-1"></main>
</div>
<nav id="nav" aria-label="Hauptbereiche"></nav>
<div id="layer"></div>
<div id="live" aria-live="polite"></div>

<script>
/* ---------- Daten aus den fotografierten Plänen (KW 1 bis 9, 2027) ---------- */
const ROUTES={F:{name:'Fieberbrunn',c:'#1A5376',cs:'#D9E9FA',h1:'#BFD9F3',h2:'#A9CBEC',t:'#123E59'},H:{name:'Hochfilzen',c:'#0F766E',cs:'#D8F0E3',h1:'#BDE3CE',h2:'#A5D6BB',t:'#0C5A3F'},W:{name:'Waidring',c:'#6A4699',cs:'#E7E1F8',h1:'#D3C9F1',h2:'#C0B3E8',t:'#4E3585'}};
const NEW='Neues Auto';
const PLAN=[
 {note:'Mittwoch, 6. Jänner ist Feiertag.',
  F:[['MO-DI','Vincent Fuchs','KB 636 EE'],['MI','Pep Foidl'],['DO-FR','Vincent Fuchs'],['SA-SO','Pep Foidl']],
  H:[['MO-DI','Peggy Schubert','KB 448 KD'],['MI','Sepp Schwaighofer'],['DO-FR','Peggy Schubert'],['SA-SO','Sepp Schwaighofer']],
  W:[['MO-SO','Rosa Mittendrein','KB 960 FB']]},
 {F:[['MO-FR','Vincent Fuchs','KB 636 EE'],['SA-SO','Tina Pletzenauer']],
  H:[['MO-FR','Peggy Schubert',NEW],['SA-SO','Toni Mittendrein']],
  W:[['MO-SO','Hans Foidl','KB 960 FB']]},
 {F:[['MO-FR','Vincent Fuchs','KB 636 EE'],['SA-SO','Toni Hechenbichler']],
  H:[['MO-SO','Gidi Treffer',NEW]],
  W:[['MO-SO','Anni Jell','KB 960 FB']]},
 {F:[['MO-FR','Vincent Fuchs',NEW],['SA-SO','Gidi Treffer']],
  H:[['MO-SO','Rolland Lassnig','KB 448 KD']],
  W:[['MO-SO','Mich Schwaiger','KB 960 FB']]},
 {F:[['MO-FR','Vincent Fuchs','KB 448 KD'],['SA-SO',null]],
  H:[['MO-SO','Hans Stocker',NEW]],
  W:[['MO-SO','Bernhard Schlemmer','KB 960 FB']]},
 {note:'Fasching: Montag 8. bis Mittwoch 10. Februar.',
  F:[['MO-FR','Vincent Fuchs','KB 448 KD'],['SA-SO','Toni Hechenbichler']],
  H:[['MO-FR','Peggy Schubert',NEW],['SA-SO','Anneliese Merker']],
  W:[['MO-SO','Fred Hausberger','KB 960 FB']]},
 {F:[['MO-SO','Gidi Treffer','KB 448 KD']],
  H:[['MO-FR','Vincent Fuchs',NEW],['SA-SO',null]],
  W:[['MO-FR','Peggy Schubert','KB 960 FB'],['SA-SO','Mich Schwaiger']]},
 {F:[['MO-SO','Martina Pletzenauer','KB 448 KD']],
  H:[['MO-FR','Vincent Fuchs',NEW],['SA-SO','Toni Hechenbichler']],
  W:[['MO-SO','Mich Schwaiger','KB 960 FB']]},
 {F:[['MO-SO','Robert Schwaiger','KB 448 KD']],
  H:[['MO-FR','Vincent Fuchs',NEW],['SA-SO',null]],
  W:[['MO-SO','Leo Niedermoser','KB 960 FB']]}
];
const DAYS=['MO','DI','MI','DO','FR','SA','SO'], DSHORT=['Mo','Di','Mi','Do','Fr','Sa','So'],
      DLONG=['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'],
      MON=['Jänner','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const START=Date.UTC(2027,0,4), TODAY=3*7+3, COORD='Peggy Schubert';

const segs=[];
PLAN.forEach((w,wk)=>Object.keys(ROUTES).forEach(r=>{let plate=w[r][0][2];
  w[r].forEach((s,i)=>{const p=s[0].split('-');const d0=DAYS.indexOf(p[0]),d1=DAYS.indexOf(p[1]||p[0]);
    segs.push({id:wk+r+i,wk,r,d0,d1,who:s[1],plate:s[2]||plate,cands:[],left:null,fresh:false});});}));
segs.find(s=>s.id==='4F1').cands.push('Tina Pletzenauer'); // Beispiel-Meldung
const people=[...new Set(segs.map(s=>s.who).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'de'));

const S={me:'Robert Schwaiger',view:'heute',wk:3};
const isCoord=()=>S.me===COORD;

/* ---------- Hilfen ---------- */
const esc=t=>String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const first=n=>n.split(' ')[0];
const date=n=>new Date(START+n*864e5);
const dm=n=>{const d=date(n);return d.getUTCDate()+'. '+MON[d.getUTCMonth()];};
const a=s=>s.wk*7+s.d0, b=s=>s.wk*7+s.d1;
function when(s){const A=a(s),B=b(s);
  if(A===B) return DSHORT[s.d0]+' '+dm(A);
  const same=date(A).getUTCMonth()===date(B).getUTCMonth();
  const left=DSHORT[s.d0]+' '+(same?date(A).getUTCDate()+'.':dm(A));
  return left+(B-A===1?' und ':' bis ')+DSHORT[s.d1]+' '+dm(B);}
const daysLabel=s=>s.d0===s.d1?DSHORT[s.d0]:DSHORT[s.d0]+'–'+DSHORT[s.d1];
const weekLabel=wk=>{const A=wk*7,B=A+6;return (date(A).getUTCMonth()===date(B).getUTCMonth()?date(A).getUTCDate()+'.':dm(A))+' bis '+dm(B);};
const upcoming=s=>b(s)>=TODAY;
const openSegs=()=>segs.filter(s=>!s.who&&upcoming(s));
const nameOf=n=>n===S.me?'Du':esc(n);
const plate=p=>p===NEW?'<span class="plate new"><b>Neues Auto</b></span>':'<span class="plate" aria-label="Kennzeichen '+esc(p)+'"><b>'+esc(p)+'</b></span>';
const routeHead=r=>'<div class="route"><span class="dot" style="background:'+ROUTES[r].c+'"></span>'+ROUTES[r].name+'</div>';
const TINT=['#D9E9FA','#D8F0E3','#E7E1F8','#FFE9D6','#FBE1E6','#FFF0BF'];
const ini=n=>{const p=n.split(' ');return esc(p[0][0]+(p[1]?p[1][0]:''));};
const av=(n,r,big)=>{let h=0;for(const ch of n)h=(h*31+ch.charCodeAt(0))>>>0;
  return '<span class="av'+(big?' big':'')+'" aria-hidden="true" style="background:'+(r?ROUTES[r].cs+';color:'+ROUTES[r].t:TINT[h%TINT.length])+'">'+ini(n)+'</span>';};
function van(body,cls,win,stripe){return '<svg class="'+(cls||'van')+'" viewBox="0 0 160 80" aria-hidden="true">'
 +'<path d="M12 58V26a10 10 0 0 1 10-10h70a12 12 0 0 1 9 4l16 20 18 5a10 10 0 0 1 8 10v9a4 4 0 0 1-4 4H16a4 4 0 0 1-4-4z" fill="'+body+'"/>'
 +'<path d="M96 23h4a6 6 0 0 1 5 2.5L116 40H96z" fill="'+(win||'#DCEBF7')+'"/><rect x="20" y="42" width="72" height="6" rx="3" fill="'+(stripe||'#fff')+'"'+(stripe?'':' opacity=".35"')+'/>'
 +'<rect x="139" y="46" width="6" height="6" rx="2" fill="#FFC24A"/>'
 +[44,118].map(x=>'<g transform="translate('+x+' 62)"><g class="spin"><circle r="12" fill="#1B2333"/><circle r="5" fill="#E7ECF4"/><path d="M-4.5 0h9M0-4.5v9" stroke="#1B2333" stroke-width="1.5" stroke-linecap="round"/></g></g>').join('')
 +'</svg>';}
const scene=(r,pl)=>{const R=ROUTES[r];return '<div class="scene"><svg class="hills" viewBox="0 0 390 96" preserveAspectRatio="none" aria-hidden="true"><circle cx="306" cy="18" r="13" fill="#FFD98A"/>'
 +'<path d="M0 96V64c50-28 100-32 150-12s84 18 128-8 78-20 112-4v56z" fill="'+R.h1+'"/><path d="M0 96V82c70-14 140-16 210-8s120 6 180-6v28z" fill="'+R.h2+'"/></svg>'
 +van('#fff','van','#8FBDE0',R.c)+pl+'</div>';};
function driveBy(r){if(window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches)return;
  const d=document.createElement('div');d.className='pass';d.innerHTML=van(ROUTES[r].c,'x');document.body.appendChild(d);d.addEventListener('animationend',()=>d.remove());}

/* ---------- Ansichten ---------- */
function segCardMine(s){
  const now=a(s)<=TODAY;
  return '<div class="card'+(s.fresh?' flash':'')+'">'+routeHead(s.r)
   +'<p class="when">'+when(s)+'</p>'
   +'<div class="meta">'+plate(s.plate)+(now?'<span class="pill now">Läuft gerade</span>':'')+(s.fresh?'<span class="pill ok">Von Peggy bestätigt</span>':'')+'</div>'
   +'<button class="btn stop" data-a="cancel" data-id="'+s.id+'">Ich kann nicht fahren</button></div>';}

function openCard(s){
  const mine=s.cands.includes(S.me), others=s.cands.filter(n=>n!==S.me);
  let h='<div class="card open">'+routeHead(s.r)+'<p class="when">'+when(s)+'</p>'
   +'<div class="meta">'+plate(s.plate)+'</div>'
   +(s.left?'<p class="small">'+esc(s.left)+' kann nicht fahren. Ersatz gesucht.</p>':'');
  if(isCoord()){
    h+=s.cands.length?'<p class="small"><strong>Gemeldet haben sich:</strong></p><div class="cands">'
      +s.cands.map(n=>'<div class="cand"><span class="person">'+av(n)+nameOf(n)+'</span><button class="btn go" data-a="approve" data-id="'+s.id+'" data-n="'+esc(n)+'">Freigeben</button></div>').join('')+'</div>'
      :'<p class="small">Noch hat sich niemand gemeldet.</p>';
    h+='<button class="btn ghost" data-a="assign" data-id="'+s.id+'">Selbst jemanden eintragen</button>';
  }else{
    if(others.length) h+='<p class="small">Schon gemeldet: <strong>'+others.map(esc).join(', ')+'</strong></p>';
    h+=mine?'<span class="pill wait">Du hast dich gemeldet. Peggy gibt Bescheid.</span><button class="btn quiet" data-a="withdraw" data-id="'+s.id+'">Meldung zurückziehen</button>'
           :'<button class="btn" data-a="offer" data-id="'+s.id+'">Ich kann fahren</button>';
  }
  return h+'</div>';}

function hero(s){
  if(!s) return '<section class="hero" style="--cs:#D9E9FA"><span class="pill tag">Dein nächster Dienst</span><p class="big">Derzeit kein Dienst eingetragen</p><button class="btn white" data-a="go" data-v="offen">Offene Dienste ansehen</button></section>';
  const now=a(s)<=TODAY;
  return '<section class="hero'+(s.fresh?' flash':'')+'" style="--cs:'+ROUTES[s.r].cs+'"><span class="pill tag">Dein nächster Dienst</span><p class="big">'+ROUTES[s.r].name+'</p><p class="when">'+when(s)+'</p>'
   +scene(s.r,plate(s.plate))+((now||s.fresh)?'<div class="meta" style="margin-top:10px">'+(now?'<span class="pill now">Läuft gerade</span>':'')+(s.fresh?'<span class="pill ok">Von Peggy bestätigt</span>':'')+'</div>':'')
   +'<button class="btn white" data-a="cancel" data-id="'+s.id+'">Ich kann nicht fahren</button></section>';}

function vHeute(){
  const d=date(TODAY), o=openSegs(), waiting=o.filter(s=>s.cands.length).length;
  const next=segs.filter(s=>s.who===S.me&&upcoming(s))[0];
  const al=(n,txt)=>'<button class="alert" data-a="go" data-v="offen"><span class="bang">'+n+'</span><span class="mid">'+txt+'</span><span class="chev" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></span></button>';
  let h='<div class="top"><div class="greet"><div><h1 class="hello">Servus, '+esc(first(S.me))+'</h1><p class="sub">'+DLONG[3]+', '+d.getUTCDate()+'. '+MON[d.getUTCMonth()]+'</p></div>'+av(S.me,null,true)+'</div>'+hero(next);
  if(isCoord()&&waiting) h+=al(waiting,(waiting===1?'Meldung wartet':'Meldungen warten')+' auf deine Freigabe');
  else if(o.length) h+=al(o.length,(o.length===1?'Dienst sucht':'Dienste suchen')+' noch jemanden');
  h+='</div><h2>Heute unterwegs</h2><div class="stack">';
  Object.keys(ROUTES).forEach(r=>{const s=segs.find(x=>x.r===r&&a(x)<=TODAY&&b(x)>=TODAY);
    h+='<div class="card line"><span class="person">'+(s.who?av(s.who,r):'<span class="av q" aria-hidden="true">?</span>')
     +'<span class="t"><span class="who">'+(s.who?nameOf(s.who):'Noch offen')+'</span><span class="small">'+ROUTES[r].name+'</span></span></span>'+plate(s.plate)+'</div>';});
  return h+'</div>';}

function vPlan(){
  const wk=S.wk, w=PLAN[wk];
  let h='<h1 class="hello">Fahrplan</h1><div class="weeknav"><button data-a="wk" data-d="-1" aria-label="Vorige Woche"'+(wk===0?' disabled':'')+'>‹</button>'
   +'<div><strong>Woche '+(wk+1)+'</strong><span class="sub">'+weekLabel(wk)+'</span>'+(wk===3?'<span class="pill now" style="margin-top:6px">Diese Woche</span>':'')+'</div>'
   +'<button data-a="wk" data-d="1" aria-label="Nächste Woche"'+(wk===PLAN.length-1?' disabled':'')+'>›</button></div>';
  if(w.note) h+='<p class="note narrow">'+w.note+'</p>';
  h+='<div class="stack">';
  Object.keys(ROUTES).forEach(r=>{const list=segs.filter(s=>s.wk===wk&&s.r===r);
    h+='<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px">'+routeHead(r)+van(ROUTES[r].c,'van-s')+'</div><div class="meta">'+plate(list[0].plate)+'</div>'
     +'<div class="cover" aria-hidden="true" style="--c:'+ROUTES[r].c+';--cs:'+ROUTES[r].h1+'">'+DSHORT.map(x=>'<span>'+x+'</span>').join('')
     +list.map(s=>'<span class="bar'+(s.who===S.me?' me':'')+(s.who?'':' gap')+'" style="grid-column:'+(s.d0+1)+'/'+(s.d1+2)+'"></span>').join('')+'</div><div class="rows">';
    list.forEach(s=>{const me=s.who===S.me;
      h+='<div class="row'+(me?' me':'')+(s.who?'':' gap')+'">'+(s.who?av(s.who,r):'<span class="av q" aria-hidden="true">?</span>')
       +'<span class="t"><span class="days">'+daysLabel(s)+'</span><span class="n">'+(s.who?esc(s.who):'Noch offen'+(s.cands.length?' · '+s.cands.length+' gemeldet':''))+'</span></span>'
       +(me?'<span class="pill you">Du</span>':'')
       +(!s.who&&upcoming(s)?'<button class="btn ghost" data-a="go" data-v="offen">Ansehen</button>':'')+'</div>';});
    h+='</div></div>';});
  return h+'</div>';}

function vOffen(){
  const o=openSegs();
  let h='<div><h1 class="hello">Offene Dienste</h1><p class="sub">'+(isCoord()?'Du entscheidest, wer fährt. Erst dann steht der Name im Plan.':'Melde dich mit einem Tipp. Peggy bestätigt, wer fährt.')+'</p></div>';
  h+=o.length?'<div class="stack">'+o.map(openCard).join('')+'</div>':'<div class="card"><p class="who">Alles besetzt.</p><p>Im Moment wird niemand gesucht.</p></div>';
  return h;}

function vIch(){
  if(isCoord()){
    return '<div><h1 class="hello">Team</h1><p class="sub">'+people.length+' Fahrerinnen und Fahrer</p></div>'
     +'<div class="stack"><div class="card"><p><strong>Ein Link für alle.</strong> Stell ihn einmal in die WhatsApp-Gruppe. Jede Person tippt beim ersten Öffnen auf ihren Namen. Das Handy merkt sich das.</p>'
     +'<button class="btn" data-a="copy">Einladungs-Link kopieren</button></div>'
     +'<div class="card"><form id="addForm" class="stack"><label class="field" for="newName">Neue Person aufnehmen<input id="newName" autocomplete="off" placeholder="Vorname Nachname"></label><button class="btn ghost" type="submit">Hinzufügen</button></form></div></div>'
     +'<h2>Alle im Team</h2><div class="stack">'+people.map(n=>{const c=segs.filter(s=>s.who===n&&upcoming(s)).length;
        return '<div class="card line"><span class="person">'+av(n)+'<strong>'+esc(n)+'</strong></span><span class="small">'+(c?c+(c===1?' Dienst':' Dienste'):'kein Dienst')+'</span></div>';}).join('')+'</div>';
  }
  const mine=segs.filter(s=>s.who===S.me&&upcoming(s)), asked=openSegs().filter(s=>s.cands.includes(S.me));
  let h='<div><h1 class="hello">Meine Dienste</h1><p class="sub">'+esc(S.me)+'</p></div>';
  h+=mine.length?'<div class="stack">'+mine.map(segCardMine).join('')+'</div>':'<div class="card"><p>Du bist derzeit für keinen Dienst eingetragen.</p><button class="btn" data-a="go" data-v="offen">Offene Dienste ansehen</button></div>';
  if(asked.length) h+='<h2>Gemeldet, noch nicht bestätigt</h2><div class="stack">'+asked.map(openCard).join('')+'</div>';
  return h+'<button class="btn quiet narrow" data-a="who">Nicht '+esc(first(S.me))+'? Person wechseln</button>';}

function vWer(){
  return '<div><h1 class="hello">Wer bist du?</h1><p class="sub">Tippe auf deinen Namen. Das musst du nur einmal machen.</p></div><div class="names">'
   +people.map(n=>'<button class="btn ghost" data-a="pick" data-n="'+esc(n)+'">'+av(n)+esc(n)+'</button>').join('')+'</div>';}

const IC={heute:'<path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/>',plan:'<rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/>',
 offen:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/>',ich:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/>'};
function render(focus){
  const V={heute:vHeute,plan:vPlan,offen:vOffen,ich:vIch,wer:vWer};
  main.innerHTML=V[S.view]();
  const n=openSegs().length, tabs=[['heute','Heute'],['plan','Plan'],['offen','Offen'],['ich',isCoord()?'Team':'Meine']];
  nav.innerHTML=S.view==='wer'?'':tabs.map(t=>'<button data-a="go" data-v="'+t[0]+'"'+(S.view===t[0]?' aria-current="page"':'')+'><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+IC[t[0]]+'</svg>'+t[1]
    +(t[0]==='offen'&&n?'<span class="badge" aria-label="'+n+' offen">'+n+'</span>':'')+'</button>').join('');
  demoRow.innerHTML='<button data-a="pick" data-n="Robert Schwaiger" aria-pressed="'+(S.me!==COORD&&S.view!=='wer')+'">Fahrer'+(S.me!==COORD?' ('+esc(first(S.me))+')':'')+'</button>'
   +'<button data-a="pick" data-n="'+COORD+'" aria-pressed="'+(isCoord()&&S.view!=='wer')+'">Peggy</button><button data-a="who" aria-pressed="'+(S.view==='wer')+'">Andere</button>';
  if(focus){window.scrollTo(0,0);main.style.animation='none';main.offsetWidth;main.style.animation='';main.focus({preventScroll:true});}
  segs.forEach(s=>s.fresh=false);}

/* ---------- Dialog und Rückmeldung ---------- */
let lastFocus=null;
function sheet(html){lastFocus=document.activeElement;
  layer.innerHTML='<div class="veil" data-a="close"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh">'+html+'</div></div>';
  layer.querySelector('button').focus();}
function closeSheet(){layer.innerHTML='';if(lastFocus&&document.contains(lastFocus))lastFocus.focus();}
function ask(title,text,yes,fn,cls){sheet('<h3 id="sh">'+title+'</h3><p>'+text+'</p><button class="btn '+(cls||'')+'" data-a="yes">'+yes+'</button><button class="btn quiet" data-a="close">Zurück</button>');pending=fn;}
let pending=null,tt=null;
function toast(msg){clearTimeout(tt);const old=document.querySelector('.toast');if(old)old.remove();
  const t=document.createElement('div');t.className='toast';
  t.innerHTML='<svg viewBox="0 0 34 34" fill="none" aria-hidden="true"><circle cx="17" cy="17" r="17" fill="#D8F0E3"/><path d="M9.5 17.5l5 5L24.5 12.5" stroke="#0C5A3F" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>'+msg+'</span>';
  document.body.appendChild(t);live.textContent=msg;tt=setTimeout(()=>t.remove(),4200);}
const where=s=>ROUTES[s.r].name+', '+when(s);

/* ---------- Aktionen ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const A=el.dataset.a, s=segs.find(x=>x.id===el.dataset.id);
  if(A==='close'){if(el.classList.contains('veil')&&e.target!==el)return;closeSheet();}
  else if(A==='yes'){const f=pending;pending=null;layer.innerHTML='';f&&f();}
  else if(A==='go'){S.view=el.dataset.v;render(true);}
  else if(A==='wk'){S.wk+=+el.dataset.d;render();}
  else if(A==='who'){S.view='wer';render(true);}
  else if(A==='pick'){const n=el.dataset.n;if(layer.innerHTML&&pickFor){const t=pickFor;pickFor=null;layer.innerHTML='';fix(t,n);return;}
    S.me=n;S.view='heute';render(true);toast('Du bist als '+esc(n)+' angemeldet.');}
  else if(A==='offer') ask('Kannst du fahren?','<strong>'+where(s)+'</strong><br>Peggy sieht deine Meldung und bestätigt, wer fährt.','Ja, ich kann fahren',()=>{
    if(!s.cands.includes(S.me))s.cands.push(S.me);render();driveBy(s.r);toast('Danke, '+esc(first(S.me))+'! Peggy gibt dir Bescheid.');});
  else if(A==='withdraw') ask('Meldung zurückziehen?','<strong>'+where(s)+'</strong>','Ja, zurückziehen',()=>{
    s.cands=s.cands.filter(n=>n!==S.me);render();toast('Deine Meldung ist zurückgezogen.');},'stop');
  else if(A==='cancel') ask('Kannst du wirklich nicht fahren?','<strong>'+where(s)+'</strong><br>Der Dienst wird für alle als offen angezeigt. Peggy sucht Ersatz.','Ja, ich kann nicht fahren',()=>{
    s.left=S.me;s.who=null;s.cands=[];render();toast('Gemeldet. Alle sehen jetzt, dass Ersatz gesucht wird.');},'stop');
  else if(A==='approve'){const n=el.dataset.n;ask(esc(first(n))+' freigeben?','<strong>'+where(s)+'</strong><br>'+esc(n)+' steht dann fix im Plan. Alle sehen es sofort.','Ja, '+esc(first(n))+' fährt',()=>fix(s,n),'go');}
  else if(A==='assign'){pickFor=s;sheet('<h3 id="sh">Wer fährt?</h3><p>'+where(s)+'</p><div class="names">'+people.map(n=>'<button class="btn ghost" data-a="pick" data-n="'+esc(n)+'">'+av(n)+esc(n)+'</button>').join('')+'</div><button class="btn quiet" data-a="close">Zurück</button>');}
  else if(A==='copy'){const ok=()=>toast('Link kopiert. Jetzt in WhatsApp einfügen.');
    try{navigator.clipboard.writeText('https://fahrplan.beispiel.at/einladung').then(ok,()=>toast('Im Prototyp gibt es noch keinen echten Link.'));}catch(_){toast('Im Prototyp gibt es noch keinen echten Link.');}}
});
let pickFor=null;
function fix(s,n){s.who=n;s.cands=[];s.left=null;s.fresh=true;render();driveBy(s.r);toast(esc(first(n))+' fährt. Der Plan ist für alle aktuell.');}
document.addEventListener('submit',e=>{e.preventDefault();
  if(e.target.id==='addForm'){const v=document.getElementById('newName').value.trim().replace(/\s+/g,' ');
    if(!v){toast('Bitte zuerst einen Namen eintippen.');return;}
    if(!people.includes(v)){people.push(v);people.sort((x,y)=>x.localeCompare(y,'de'));}
    render();toast(esc(v)+' ist jetzt im Team.');}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&layer.innerHTML){pickFor=null;closeSheet();}});
const main=document.getElementById('main'),nav=document.getElementById('nav'),layer=document.getElementById('layer'),live=document.getElementById('live'),demoRow=document.getElementById('demoRow');
render();
</script>
</body>
</html>
